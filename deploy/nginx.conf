# Konfigurasi nginx untuk YT2MP3.
# Letakkan di /etc/nginx/sites-available/yt2mp3 lalu aktifkan:
#   sudo ln -s /etc/nginx/sites-available/yt2mp3 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;               # ganti dengan domain Anda, mis. example.com

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Penting untuk progress konversi (Server-Sent Events) ---
        # Tanpa baris ini nginx akan menahan event sampai buffer penuh,
        # sehingga progress di browser tidak muncul real-time.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
